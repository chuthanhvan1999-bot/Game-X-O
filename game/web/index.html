
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game X-O</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="game-container">

        <h1>🎮 TIC TAC TOE</h1>
        <p class="subtitle">Trò chơi caro X-O</p>

        <div class="score-board">
            <div class="score x-score">
                <span>Người chơi X</span>
                <h2 id="scoreX">0</h2>
            </div>

            <div class="score o-score">
                <span>Người chơi O</span>
                <h2 id="scoreO">0</h2>
            </div>
        </div>

        <div class="status" id="status">
            Đến lượt người chơi X
        </div>

        <div class="board" id="board">
            <button class="cell" data-index="0"></button>
            <button class="cell" data-index="1"></button>
            <button class="cell" data-index="2"></button>
            <button class="cell" data-index="3"></button>
            <button class="cell" data-index="4"></button>
            <button class="cell" data-index="5"></button>
            <button class="cell" data-index="6"></button>
            <button class="cell" data-index="7"></button>
            <button class="cell" data-index="8"></button>
        </div>

        <div class="buttons">
            <button id="restart">🔄 Chơi lại</button>
            <button id="reset">🗑 Đặt lại điểm</button>
        </div>

        <p class="footer">Chúc bạn chơi vui vẻ! ❤️</p>

    </div>

    <script src="script.js"></script>

</body>
</html>
